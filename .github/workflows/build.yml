name: Build Linux package
on:
  workflow_dispatch:
  push:
    branches: ['feature/wolf-driver-maintenance']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc binutils make curl libgtk-3-0t64 libgdk-pixbuf-2.0-0 libfontconfig1 libssl-dev libssl3t64 python3 python3-pil
      - name: Build package
        run: make package
      - name: Verify package contents and tests
        run: |
          set -e
          dpkg-deb --contents dist/OptiPlex-Now_1.12.0_amd64.deb | grep -q 'hicolor/24x24/apps/optiplex-now-tray.png'
          dpkg-deb --contents dist/OptiPlex-Now_1.12.0_amd64.deb | grep -q 'hicolor/16x16/apps/optiplex-now-tray.png'
          python3 -m unittest discover -s tests -v
      - name: Publish test release
        if: github.ref == 'refs/heads/feature/wolf-driver-maintenance'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.12.0-rc.1
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/OptiPlex-Now_1.12.0_amd64.deb --clobber
          else
            gh release create "$tag" dist/OptiPlex-Now_1.12.0_amd64.deb --prerelease --target "$GITHUB_SHA" --title "OptiPlex Now 1.12.0 RC1" --notes "Test build: compact launcher, Desktop (Wolf XFCE), VueTorrent Downloads, sunset accents and all tray icon sizes. Please test COSMIC tray behavior before stable release."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: optiplex-now-linux-deb
          path: dist/*.deb
