name: Build Linux package
on:
  workflow_dispatch:
  push:
    branches: ['release/1.13.0']
permissions:
  contents: read
# A fresh branch push must supersede prior builds; all CI runs publish the same RC asset.
concurrency:
  group: optiplex-now-rc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc binutils make curl libgtk-3-0t64 libgdk-pixbuf-2.0-0 libfontconfig1 libssl-dev libssl3t64 python3 python3-pil
      - name: Build package
        run: make package
      - name: Verify package contents and tests
        run: |
          set -e
          dpkg-deb --contents dist/OptiPlex-Now_1.13.0_amd64.deb | grep -q 'hicolor/24x24/apps/optiplex-now-tray.png'
          dpkg-deb --contents dist/OptiPlex-Now_1.13.0_amd64.deb | grep -q 'hicolor/16x16/apps/optiplex-now-tray.png'
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: optiplex-now-linux-deb
          path: dist/*.deb
