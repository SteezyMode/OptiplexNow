name: Validate OptiPlex NOW

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Rebuild and smoke-test even when no commits land (toolchain/apt drift).
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  native-sanitizers:
    name: Native memory and UB diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libfontconfig1-dev
      - name: Run ASan, UBSan and stricter module compile
        run: |
          set -euo pipefail
          make check-sanitizers

  build-and-test:
    runs-on: ubuntu-24.04
    # Ubuntu mirrors have repeatedly taken >20 min to deliver unrelated
    # recommended packages. Preserve full tests without false CI timeouts.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          # Install explicitly required tools first, without unrelated
          # recommended drivers/desktop extras. The installed-.deb smoke below
          # still uses default apt behavior and checks actual package deps.
          sudo apt-get install -y --no-install-recommends build-essential binutils curl mpv python3-pil python3-cryptography libssl-dev libgtk-3-dev libfontconfig1-dev gvfs-backends xvfb xauth x11-utils dbus-x11 desktop-file-utils openssh-client
      # Closed-beta test builds must not impersonate the last published .deb.
      - name: Stamp unreleased PR package version
        if: github.event_name == 'pull_request'
        run: |
          base="$(sed -nE 's/^DEFAULT_VERSION = "([^"]+)"$/\1/p' package.py)"
          test -n "$base"
          echo "NOW_PACKAGE_VERSION=${base}+pr${{ github.event.pull_request.number }}.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build, test and inspect package
        shell: bash
        run: |
          set -euo pipefail
          # Catch malformed shell test changes before the expensive build/install.
          for smoke in tests/smoke_installed_package.sh tests/smoke_host_readiness.sh; do
            bash -n "$smoke"
          done
          make check-instance-lock
          make check-process
          make check-presets
          make check-config
          make check-wolf-pairing
          make check-wolf-transport
          make check-games-flow
          make check-ui-settings
          make check-ui-wizard
          make check-settings-persistence
          make check-media-endpoint-token
          make check-tailscale
          make check-host-metrics
          make check-host-job-target
          make check-backup-async
          make check-tray-prefs
          make check-tray-actions
          make check-music-queue-order
          make check-music-helper-paths
          make check-desktop-autostart
          make check-moonlight-install
          make check-wizard-network
          make check-wizard-services
          make check-service-probe
          make package
          bash tests/smoke_gtk.sh
          xvfb-run -a /usr/bin/python3 tests/smoke_owner_qr_ui.py
          bash tests/smoke_instance.sh
          python3 -m unittest discover -s tests -v
          test -x build/optiplex-desk
          test -x build/optiplex-now-backup
          readelf -W -l build/optiplex-desk | grep 'GNU_STACK' | grep -Eq '[[:space:]]RW[[:space:]]'
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name 'OptiPlex-Now_*_amd64.deb')
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb -f "$package" Package)" = "optiplex-now"
          test "$(dpkg-deb -f "$package" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$package" Version)" != ""
          dpkg-deb --contents "$package" | grep '/usr/bin/optiplex-now$'
          bash tests/smoke_installed_package.sh
      - name: Record checksum for installable PR package
        if: github.event_name == 'pull_request'
        run: |
          cd dist
          sha256sum OptiPlex-Now_*_amd64.deb > SHA256SUMS
      - name: Upload unreleased PR test installer
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optiplex-now-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: |
            dist/OptiPlex-Now_*_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      # One-off release of the owner-approved Downloads fix. Build/test and
      # native sanitizers must both pass before the new Latest is published.
      - name: Stage v1.22.2 release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: OptiPlex NOW v1.22.2')
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'DEFAULT_VERSION = "1.22.2"' package.py
          test -s dist/OptiPlex-Now_1.22.2_amd64.deb
          cp dist/OptiPlex-Now_1.22.2_amd64.deb dist/OptiPlex-Now_amd64.deb
          (cd dist && sha256sum OptiPlex-Now_1.22.2_amd64.deb OptiPlex-Now_amd64.deb > SHA256SUMS)
      - name: Upload v1.22.2 release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: OptiPlex NOW v1.22.2')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optiplex-now-release-v1.22.2-${{ github.run_number }}
          path: |
            dist/OptiPlex-Now_1.22.2_amd64.deb
            dist/OptiPlex-Now_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release-v1-22-2:
    name: Publish verified owner Downloads update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: OptiPlex NOW v1.22.2')
    needs: [native-sanitizers, build-and-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: optiplex-now-release-v1.22.2-${{ github.run_number }}
          path: release
      - name: Publish new Latest with versioned and rolling .deb
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/OptiPlex-Now_1.22.2_amd64.deb
          test -s release/OptiPlex-Now_amd64.deb
          test -s release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
          gh release create v1.22.2 \
            release/OptiPlex-Now_1.22.2_amd64.deb \
            release/OptiPlex-Now_amd64.deb \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OptiPlex NOW v1.22.2" \
            --notes "Downloads: replace brittle SFTP destination chooser with the existing approved-drive browser; add Active, Stalled, Completed and All transfer tabs. Existing downloads and host services remain untouched by this client upgrade." \
            --latest
