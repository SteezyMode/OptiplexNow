name: Validate OptiPlex NOW

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Rebuild and smoke-test even when no commits land (toolchain/apt drift).
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl python3-pil python3-cryptography libssl-dev libgtk-3-dev libfontconfig1-dev gvfs-backends xvfb xauth x11-utils dbus-x11 desktop-file-utils
      - name: Build, test and inspect package
        shell: bash
        run: |
          set -euo pipefail
          make check-process
          make check-presets
          make package
          bash tests/smoke_gtk.sh
          bash tests/smoke_instance.sh
          python3 -m unittest discover -s tests -v
          test -x build/optiplex-desk
          test -x build/optiplex-now-backup
          readelf -W -l build/optiplex-desk | grep 'GNU_STACK' | grep -Eq '[[:space:]]RW[[:space:]]'
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name 'OptiPlex-Now_*_amd64.deb')
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb -f "$package" Package)" = "optiplex-now"
          test "$(dpkg-deb -f "$package" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$package" Version)" != ""
          dpkg-deb --contents "$package" | grep '/usr/bin/optiplex-now$'
          bash tests/smoke_installed_package.sh
