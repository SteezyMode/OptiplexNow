name: Build and publish OptiPlex Now 1.12.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1-12-0.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wolf-driver-maintenance
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make binutils curl python3 python3-pil libgtk-3-0t64 libfontconfig1 libssl-dev libglib2.0-dev
      - name: Build package and test
        run: |
          make package
          python3 -m unittest discover -s tests -v
          dpkg-deb -f dist/OptiPlex-Now_1.12.0_amd64.deb Version | grep -qx 1.12.0
          grep -Fq 'https://games.monumentrisk.com/?launch=steam' src/main.c
          sha256sum dist/OptiPlex-Now_1.12.0_amd64.deb > dist/SHA256SUMS
      - name: Publish v1.12.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp dist/OptiPlex-Now_1.12.0_amd64.deb dist/OptiPlex-Now_amd64.deb
          cd dist
          sha256sum OptiPlex-Now_1.12.0_amd64.deb OptiPlex-Now_amd64.deb > SHA256SUMS
          if gh release view v1.12.0 >/dev/null 2>&1; then
            gh release upload v1.12.0 OptiPlex-Now_1.12.0_amd64.deb OptiPlex-Now_amd64.deb SHA256SUMS --clobber
            gh release edit v1.12.0 --latest --notes "Adds Web Gaming via Wolf UI, configurable tray shortcuts with descriptive service names, and hardware-info fixes. Requires an existing configured server."
          else
            gh release create v1.12.0 OptiPlex-Now_1.12.0_amd64.deb OptiPlex-Now_amd64.deb SHA256SUMS --target "$(git rev-parse HEAD)" --title "OptiPlex Now 1.12.0" --notes "Adds Web Gaming via Wolf UI, configurable tray shortcuts with descriptive service names, and hardware-info fixes. Requires an existing configured server." --latest
          fi
