name: Publish OptiPlex NOW

# Explicit v1.21.8 official .deb: a single marked, CI-verified main
# merge may publish its curated version without manual tag credentials.
# All other main pushes and PRs are inert; regular tags remain supported.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'docs/releases/v1.21.8.md'

permissions:
  contents: write

concurrency:
  group: publish-optiplex-now
  cancel-in-progress: false

jobs:
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v1.21.8]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl python3-pil python3-cryptography libssl-dev libgtk-3-dev libfontconfig1-dev gvfs-backends xvfb xauth x11-utils dbus-x11 desktop-file-utils openssh-client
      - name: Verify release tag and build from source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # This path runs ONLY on the deliberately marked v1.21.8 merge.
            version="1.21.8"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sed -nE 's/^DEFAULT_VERSION = "([^"]+)"$/\1/p' package.py)" = "$version"
          echo "NOW_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          make check-process
          make check-presets
          make check-config
          make check-wolf-pairing
          make check-wolf-transport
          make check-tailscale
          make check-host-metrics
          make check-host-job-target
          make check-backup-async
          make check-tray-prefs
          make check-tray-actions
          make check-moonlight-install
          make check-wizard-network
          make check-service-probe
          NOW_PACKAGE_VERSION="$version" make package
          bash tests/smoke_gtk.sh
          bash tests/smoke_instance.sh
          python3 -m unittest discover -s tests -v
          test -x build/optiplex-desk
          test -x build/optiplex-now-backup
          readelf -W -l build/optiplex-desk | grep 'GNU_STACK' | grep -Eq '[[:space:]]RW[[:space:]]'
          package="dist/OptiPlex-Now_${version}_amd64.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Package)" = "optiplex-now"
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          test "$(dpkg-deb -f "$package" Architecture)" = "amd64"
          dpkg-deb --contents "$package" | grep '/usr/bin/optiplex-now$'
          bash tests/smoke_installed_package.sh
          cp "$package" dist/OptiPlex-Now_amd64.deb
          (cd dist && sha256sum "OptiPlex-Now_${version}_amd64.deb" OptiPlex-Now_amd64.deb > SHA256SUMS)
      - name: Publish new immutable versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$NOW_RELEASE_VERSION"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite published assets" >&2
            exit 1
          fi
          notes="docs/releases/${tag}.md"
          test -f "$notes" || { echo "Missing curated release notes: $notes" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # GITHUB_TOKEN-created tags do not trigger a second workflow.
            # Create immutable tag at this exact CI-tested source commit.
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          gh release create "$tag" \
            "dist/OptiPlex-Now_${version}_amd64.deb" \
            dist/OptiPlex-Now_amd64.deb \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "OptiPlex NOW ${tag} — Current Alpha"  \
            --notes-file "$notes" \
            --latest
